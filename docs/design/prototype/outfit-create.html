<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新建搭配 · 设计提案</title>
  <style>
    :root{--bg:#fff;--ink:#424b55;--muted:#66717c;--blue:#426e91;--accent:#5b8db7;--soft:#f0f6fb;--line:#e9eef3;--photo:#f8f9fb;--danger:#a54842;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:#f3f6f9;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}img{display:block;max-width:100%}h1,h2,p{margin:0}.icon{width:20px;height:20px;flex:none}.small{width:16px;height:16px}
    .review{display:grid;grid-template-columns:260px 390px 260px;justify-content:center;gap:54px;padding:42px 24px;align-items:center}.intro .eyebrow{font-size:11px;letter-spacing:2px;color:var(--blue);margin-bottom:20px}.intro h1{font-size:32px;line-height:1.4;font-weight:500;letter-spacing:1px}.intro>p{font-size:14px;line-height:1.9;color:var(--muted);margin-top:20px}.review-note{font-size:12px;line-height:1.8;color:var(--muted)}.review-note h2{font-size:15px;font-weight:500;color:var(--ink);margin:24px 0 6px}.review-note h2:first-child{margin-top:0}.preview-states{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.preview-states button{padding:7px 10px;border:1px solid #d8e2eb;border-radius:8px;background:#fff;font-size:12px}.preview-states button[aria-pressed="true"]{background:var(--soft);border-color:#a8c2d6;color:var(--blue)}.demo-label{font-size:11px;color:var(--muted);margin-top:28px}
    .phone{width:390px;height:844px;border:5px solid #e0e8ef;border-radius:38px;overflow:hidden;background:var(--photo);position:relative;display:flex;flex-direction:column;box-shadow:0 20px 60px #334b6410;isolation:isolate}.status{height:29px;flex:none;padding:9px 23px 0;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:500;background:white}.status img{width:17px;height:17px}.wechat-nav{height:43px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:white;font-size:14px}.icon-button{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:10px}.wechat-title{position:absolute;left:50%;transform:translateX(-50%)}.capsule{height:28px;width:78px;border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;justify-content:space-evenly}.capsule span{width:1px;height:15px;background:var(--line)}.capsule .icon{width:16px;height:16px}
    .editor{padding:0 16px;min-height:0;flex:1;display:flex;flex-direction:column}.title-row{display:flex;align-items:center;gap:8px;height:53px;flex:none}.name-field{min-width:0;flex:1;position:relative}.name-field input{background:none;border:0;width:100%;height:44px;font-size:19px;font-weight:500;padding:0 28px 0 0;outline-offset:0}.name-field>.icon{position:absolute;right:4px;top:15px;pointer-events:none;width:15px;height:15px;opacity:.65}.text-button{font-size:12px;color:var(--blue);min-height:40px;padding:0 8px}.text-button:disabled{color:var(--muted)}
    .canvas-shell{flex:1;min-height:220px;display:flex;flex-direction:column}.canvas{flex:1;min-height:0;position:relative;border-radius:14px;background:white;overflow:hidden;touch-action:none;box-shadow:0 2px 12px #426e9106}.canvas-item{position:absolute;padding:0;touch-action:none;user-select:none;cursor:grab;outline:none}.canvas-item>.garment{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}.canvas-item.selected{outline:1px solid #8facbf;outline-offset:-1px}.handle{position:absolute;width:29px;height:29px;background:#fff;border-radius:50%;box-shadow:0 2px 8px #29485f15;display:grid;place-items:center;z-index:2;touch-action:none}.handle .icon{width:15px;height:15px;pointer-events:none}.handle.rotate{left:-12px;top:-12px}.handle.remove{right:-12px;top:-12px}.handle.resize{right:-12px;bottom:-12px;cursor:nwse-resize}.handle.resize .icon{transform:rotate(-45deg)}.canvas-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:13px;pointer-events:none}.canvas-empty .icon{width:38px;height:38px;opacity:.5}.canvas-footer{height:39px;display:flex;align-items:center;justify-content:space-between;flex:none}.canvas-footer>span{font-size:11px;color:var(--muted)}.canvas-actions{display:flex;align-items:center;gap:2px}.canvas-actions button{display:flex;align-items:center;gap:5px;font-size:11px;padding:0 7px;min-height:38px;color:var(--blue)}.canvas-actions .icon{width:15px;height:15px}
    .library{height:188px;flex:none;background:var(--bg);margin:0 -16px;padding:0 16px;border-top:1px solid var(--line)}.library-tabs{display:flex;align-items:center;justify-content:space-between;height:43px}.tabs{display:flex;gap:24px;height:100%}.tab{font-size:14px;padding:0 1px;position:relative;color:var(--muted)}.tab[aria-selected="true"]{color:var(--blue);font-weight:500}.tab[aria-selected="true"]:after{content:"";position:absolute;bottom:0;left:25%;right:25%;height:2px;background:var(--blue);border-radius:2px}.selection-count{font-size:11px;color:var(--muted)}.categories{height:39px;display:flex;gap:7px;align-items:center;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;padding:6px 13px;border-radius:8px;font-size:11px;color:var(--muted);background:var(--photo);min-height:29px}.chip[aria-pressed="true"]{background:var(--soft);color:var(--blue)}.clothes{display:flex;gap:9px;overflow:auto;scrollbar-width:none;padding:7px 1px 10px;height:105px}.clothing{position:relative;flex:0 0 73px;border-radius:10px;background:var(--photo);height:83px;padding:6px;border:1px solid transparent}.clothing>.garment{width:100%;height:100%;object-fit:contain}.clothing[aria-pressed="true"]{border-color:#bfd3e2;background:#f4f8fc}.chosen{width:17px;height:17px;position:absolute;right:3px;top:3px;background:var(--blue);border-radius:50%;padding:3px}.chosen img{width:100%;height:100%;filter:brightness(0) invert(1)}.library-state{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-size:12px;color:var(--muted)}.library-state button{color:var(--blue);text-decoration:underline;min-height:44px}.skeleton{flex:0 0 73px;height:83px;border-radius:10px;background:linear-gradient(110deg,#f4f6f8 30%,#e9eef3 50%,#f4f6f8 70%);background-size:200% 100%;animation:loading 1.7s infinite}@keyframes loading{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
    .backgrounds{height:137px;display:flex;align-items:center;gap:18px;justify-content:center}.swatch{width:44px;height:44px;border-radius:50%;border:4px solid white;outline:1px solid var(--line);display:grid;place-items:center}.swatch[aria-pressed="true"]{outline:2px solid #8eafc9}.swatch .icon{width:17px;height:17px}.metadata{height:48px;display:flex;align-items:center;gap:7px;flex:none;margin:0 -16px;padding:0 16px;border-top:1px solid var(--line);background:white}.meta-button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:40px;font-size:11px;white-space:nowrap;padding:0 6px;flex:1}.meta-button span{color:var(--muted)}.meta-button .icon{width:12px;height:12px;opacity:.7}.save-area{padding:8px 16px 24px;background:white;flex:none}.primary{height:44px;border-radius:12px;background:#e3eff9;color:var(--blue);border:1px solid #dce8f2;width:100%;font-size:14px;font-weight:500;letter-spacing:.5px}.home-indicator{position:absolute;bottom:6px;left:calc(50% - 56px);height:4px;width:112px;border-radius:4px;background:#424b55;opacity:.7}
    .overlay{position:absolute;inset:0;background:#23374635;display:flex;align-items:flex-end;z-index:100}.sheet{background:white;border-radius:22px 22px 0 0;width:100%;max-height:78%;overflow:auto;padding:13px 20px 28px}.sheet-grip{width:30px;height:4px;border-radius:4px;background:#dce4ea;margin:0 auto 12px}.sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sheet-header h2{font-size:16px;font-weight:500}.sheet-content{display:grid;gap:9px}.choice{display:flex;align-items:center;justify-content:space-between;min-height:48px;background:var(--photo);padding:0 15px;border-radius:10px;font-size:14px}.choice[aria-pressed="true"]{background:var(--soft);color:var(--blue)}.choice .icon{width:17px;height:17px}.sheet label{font-size:12px;color:var(--muted)}.sheet textarea{width:100%;resize:none;height:85px;background:var(--photo);border:0;border-radius:10px;padding:12px;font-size:14px}.sheet .primary{margin-top:15px}.layer-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12px}.layer-row>img{width:38px;height:45px;object-fit:contain}.layer-row>span{flex:1}.layer-row button{font-size:11px;color:var(--blue);min-height:44px;padding:5px}.toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:#334b60ef;color:white;padding:12px 18px;border-radius:12px;font-size:12px;z-index:120;max-width:85%;text-align:center;pointer-events:none}.toast:empty{display:none}[hidden]{display:none!important}
    @media(max-width:1100px){.review{grid-template-columns:220px 390px;gap:40px}.review-note{grid-column:1/-1;max-width:650px;justify-self:center;display:flex;gap:28px}.review-note>div{flex:1}.review-note h2{margin-top:0}}@media(max-width:700px){.review{display:flex;flex-direction:column;padding:22px 0;gap:22px}.intro{width:min(390px,100%);padding:0 22px}.intro .eyebrow{margin-bottom:8px}.intro h1{font-size:25px}.intro>p{font-size:12px;margin-top:8px}.demo-label{margin-top:10px}.phone{width:min(390px,100%);height:844px;border-radius:28px}.review-note{padding:0 22px;display:block;width:min(390px,100%)}.review-note>div{margin-bottom:20px}}@media(max-width:350px){.editor{padding:0 12px}.library,.metadata{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.canvas-actions button{padding:0 5px}.meta-button{gap:3px;padding:0 2px;font-size:10px}}
  </style>
</head>
<body>
  <main class="review">
    <section class="intro"><p class="eyebrow">搭搭不搭搭 / 设计提案 01</p><h1>把搭配<br>放回画布中心</h1><p>在衣橱里挑几件，<br>挪一挪，就是今天的搭配。</p><div class="demo-label">交互设计稿 · 示例衣物 · 2026.11.14</div></section>
    <section class="phone" aria-label="新建搭配预览">
      <div class="status"><span>9:41</span><img src="assets/icons/lock.svg" alt=""></div>
      <nav class="wechat-nav"><button class="icon-button" data-action="back" aria-label="返回"><img class="icon" src="assets/icons/back.svg" alt=""></button><span class="wechat-title">新建搭配</span><div class="capsule" aria-hidden="true"><img class="icon" src="assets/icons/more.svg" alt=""><span></span><img class="icon" src="assets/icons/circle.svg" alt=""></div></nav>
      <div class="editor">
        <div class="title-row"><div class="name-field"><input id="outfit-name" aria-label="搭配名称" value="周末，慢慢走" maxlength="60"><img class="icon" src="assets/icons/edit.svg" alt=""></div><button class="text-button" data-action="clear">清空</button></div>
        <div class="canvas-shell"><div class="canvas" id="canvas" aria-label="搭配画布"></div><div class="canvas-footer"><span id="selected-label">轻点单品调整</span><div class="canvas-actions"><button data-action="undo" aria-label="撤销"><img class="icon" src="assets/icons/undo.svg" alt="">撤销</button><button data-action="layout"><img class="icon" src="assets/icons/grid.svg" alt="">排版</button><button data-action="layers"><img class="icon" src="assets/icons/layers.svg" alt="">图层</button></div></div></div>
        <section class="library" aria-label="搭配选材"><div class="library-tabs"><div class="tabs" role="tablist" aria-label="选材类型"><button class="tab" role="tab" id="closet-tab" aria-controls="closet-panel" aria-selected="true" data-tab="closet">衣橱</button><button class="tab" role="tab" id="background-tab" aria-controls="background-panel" aria-selected="false" data-tab="background">背景</button></div><span class="selection-count" id="count"></span></div><div id="closet-panel" role="tabpanel" aria-labelledby="closet-tab"><div class="categories" id="categories"></div><div class="clothes" id="clothes"></div></div><div class="backgrounds" id="background-panel" role="tabpanel" aria-labelledby="background-tab" hidden></div></section>
        <div class="metadata"><button class="meta-button" data-action="occasion"><span>场景</span><b id="occasion-label">周末出游</b><img class="icon" src="assets/icons/chevron.svg" alt=""></button><button class="meta-button" data-action="category"><span>分类</span><b id="category-label">日常穿搭</b><img class="icon" src="assets/icons/chevron.svg" alt=""></button><button class="meta-button" data-action="more">更多<img class="icon" src="assets/icons/chevron.svg" alt=""></button></div>
      </div>
      <footer class="save-area"><button class="primary" id="save" data-action="save">保存这套搭配</button></footer><div class="home-indicator"></div><div id="modal"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
    <aside class="review-note"><div><h2>选中才出现工具</h2><p>拖动位置，左上旋转，右上移除，右下缩放。图层里调整前后顺序。</p></div><div><h2>选衣时，画布一直可见</h2><p>分类横向切换，已加入的衣物显示勾选。场景与分类从底部面板选择。</p></div><div><h2>检查衣橱状态</h2><div class="preview-states" id="preview-states"><button data-state="normal" aria-pressed="true">正常</button><button data-state="loading" aria-pressed="false">加载</button><button data-state="empty" aria-pressed="false">空衣橱</button><button data-state="error" aria-pressed="false">失败</button></div></div></aside>
  </main>
  <script>
    const icon = name => `<img class="icon" src="assets/icons/${name}.svg" alt="">`;
    const clothes = [
      {id:'knit',name:'奶油色针织衫',category:'上装',asset:'cream-knit'},
      {id:'jeans',name:'直筒牛仔裤',category:'下装',asset:'blue-jeans'},
      {id:'tote',name:'焦糖色托特包',category:'包袋',asset:'brown-tote'},
      {id:'loafers',name:'棕色乐福鞋',category:'鞋履',asset:'brown-loafers'},
      {id:'coat',name:'浅驼色风衣',category:'外套',asset:'camel-coat'},
      {id:'shirt',name:'柔白棉质衬衫',category:'上装',asset:'white-shirt'},
      {id:'skirt',name:'砂色百褶半裙',category:'下装',asset:'sand-skirt'}
    ];
    const positions = [{x:9,y:9,w:47,h:47},{x:53,y:17,w:36,h:62},{x:10,y:58,w:34,h:32},{x:51,y:76,w:42,h:20}];
    const state = {items:clothes.slice(0,4).map((item,index)=>({id:item.id,...positions[index],rotation:0})),selected:'knit',history:[],filter:'全部',tab:'closet',status:'normal',background:'#ffffff',occasion:'周末出游',category:'日常穿搭',seasons:['春','秋'],notes:''};
    const canvas = document.getElementById('canvas');
    const getClothing = id => clothes.find(item=>item.id===id);
    const escapeText = value => value.replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    const remember = () => state.history.push(structuredClone(state.items));
    function notify(message){document.getElementById('toast').textContent=message;clearTimeout(notify.timer);notify.timer=setTimeout(()=>document.getElementById('toast').textContent='',2400);}
    function renderCanvas(){
      canvas.style.background=state.background;
      canvas.innerHTML=state.items.map(item=>`<div class="canvas-item ${state.selected===item.id?'selected':''}" role="button" tabindex="0" aria-label="调整${getClothing(item.id).name}" data-item="${item.id}" style="left:${item.x}%;top:${item.y}%;width:${item.w}%;height:${item.h}%;transform:rotate(${item.rotation}deg)"><img class="garment" draggable="false" src="assets/clothes/${getClothing(item.id).asset}.svg" alt="${getClothing(item.id).name}">${state.selected===item.id?`<button class="handle rotate" data-tool="rotate" aria-label="旋转">${icon('rotate')}</button><button class="handle remove" data-tool="remove" aria-label="移除">${icon('close')}</button><button class="handle resize" data-tool="resize" aria-label="缩放">${icon('arrow')}</button>`:''}</div>`).join('')+(state.items.length?'':`<div class="canvas-empty">${icon('shirt')}<span>从衣橱挑选第一件衣物</span></div>`);
      document.getElementById('selected-label').textContent=state.selected?getClothing(state.selected).name:'轻点单品调整';
      document.getElementById('count').textContent=`已选 ${state.items.length} 件`;
      document.querySelector('[data-action="undo"]').disabled=!state.history.length;
      document.querySelector('[data-action="clear"]').disabled=!state.items.length;
      document.querySelector('[data-action="layout"]').disabled=!state.items.length;
      document.querySelector('[data-action="layers"]').disabled=!state.items.length;
      document.getElementById('save').disabled=!state.items.length;
    }
    function renderLibrary(){
      document.getElementById('categories').innerHTML=['全部','上装','下装','外套','鞋履','包袋'].map(category=>`<button class="chip" data-filter="${category}" aria-pressed="${state.filter===category}">${category}</button>`).join('');
      const list=document.getElementById('clothes');
      if(state.status==='loading'){list.innerHTML='<div class="library-state" role="status" aria-label="正在加载衣橱">'+Array.from({length:5},()=>'<div class="skeleton"></div>').join('')+'</div>';return;}
      if(state.status==='error'){list.innerHTML='<div class="library-state" role="alert">衣橱加载失败<button data-state="normal">重试</button></div>';return;}
      if(state.status==='empty'){list.innerHTML='<div class="library-state">衣橱里还没有衣物<button data-action="add-clothing">添加衣物</button></div>';return;}
      list.innerHTML=clothes.filter(item=>state.filter==='全部'||item.category===state.filter).map(item=>`<button class="clothing" data-add="${item.id}" aria-label="${state.items.some(value=>value.id===item.id)?'选择':'添加'}${item.name}" aria-pressed="${state.items.some(value=>value.id===item.id)}"><img class="garment" src="assets/clothes/${item.asset}.svg" alt="${item.name}">${state.items.some(value=>value.id===item.id)?`<span class="chosen">${icon('check')}</span>`:''}</button>`).join('');
    }
    function renderBackgrounds(){document.getElementById('background-panel').innerHTML=['#ffffff','#f0f6fb','#f8f9fb','#f8f3ed'].map((color,index)=>`<button class="swatch" style="background:${color}" data-background="${color}" aria-label="${['纯白','晴空蓝','浅灰','米白'][index]}" aria-pressed="${state.background===color}">${state.background===color?icon('check'):''}</button>`).join('');}
    function openSheet(title,content){document.getElementById('modal').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-grip"></div><div class="sheet-header"><h2>${title}</h2><button class="icon-button" data-action="close" aria-label="关闭">${icon('close')}</button></div><div class="sheet-content">${content}</div></section></div>`;document.querySelector('.sheet button').focus();}
    const closeSheet = () => {document.getElementById('modal').innerHTML='';document.querySelector(`[data-action="${state.returnFocus||'more'}"]`).focus();};
    function showLayers(){openSheet('图层',state.items.toReversed().map(item=>`<div class="layer-row"><img src="assets/clothes/${getClothing(item.id).asset}.svg" alt=""><span>${getClothing(item.id).name}</span><button data-layer="${item.id}" data-direction="front">置顶</button><button data-layer="${item.id}" data-direction="back">置底</button></div>`).join(''));}
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');
      if(!button)return;
      if(button.dataset.tab){state.tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(tab=>tab.setAttribute('aria-selected',String(tab.dataset.tab===state.tab)));document.getElementById('closet-panel').hidden=state.tab!=='closet';document.getElementById('background-panel').hidden=state.tab!=='background';return;}
      if(button.dataset.filter){state.filter=button.dataset.filter;renderLibrary();return;}
      if(button.dataset.state){state.status=button.dataset.state;if(state.status==='empty'){remember();state.items=[];state.selected='';renderCanvas();}renderLibrary();document.querySelectorAll('#preview-states button').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.state===state.status)));return;}
      if(button.dataset.background){state.background=button.dataset.background;renderCanvas();renderBackgrounds();return;}
      if(button.dataset.add){const id=button.dataset.add;if(!state.items.some(item=>item.id===id)){remember();state.items.push({id,x:25,y:25,w:45,h:45,rotation:0});}state.selected=id;renderCanvas();renderLibrary();return;}
      if(button.dataset.tool==='rotate'){remember();state.items.find(item=>item.id===state.selected).rotation+=15;renderCanvas();return;}
      if(button.dataset.tool==='remove'){remember();state.items=state.items.filter(item=>item.id!==state.selected);state.selected='';renderCanvas();renderLibrary();return;}
      if(button.dataset.choice){state[button.dataset.choice]=button.dataset.value;document.getElementById(`${button.dataset.choice}-label`).textContent=button.dataset.value;closeSheet();return;}
      if(button.dataset.season){state.seasons=state.seasons.includes(button.dataset.season)?state.seasons.filter(value=>value!==button.dataset.season):[...state.seasons,button.dataset.season];button.setAttribute('aria-pressed',String(state.seasons.includes(button.dataset.season)));return;}
      if(button.dataset.layer){remember();const item=state.items.find(item=>item.id===button.dataset.layer);state.items=state.items.filter(value=>value.id!==item.id);state.items[button.dataset.direction==='front'?'push':'unshift'](item);renderCanvas();showLayers();return;}
      const action=button.dataset.action;
      if(['occasion','category','more','clear','layers'].includes(action))state.returnFocus=action;
      if(action==='close'){closeSheet();return;}
      if(action==='clear'){openSheet('清空画布？','<p style="font-size:13px;color:var(--muted)">移除画布上的所有衣物。</p><button class="primary" data-action="confirm-clear">清空画布</button>');return;}
      if(action==='confirm-clear'){remember();state.items=[];state.selected='';closeSheet();renderCanvas();renderLibrary();return;}
      if(action==='undo'){state.items=state.history.pop();state.selected='';renderCanvas();renderLibrary();return;}
      if(action==='layout'){remember();state.items=state.items.map((item,index)=>({...item,...(state.items.length<=4?positions[index]:{x:6+(index%3)*31,y:7+Math.floor(index/3)*31,w:27,h:27}),rotation:0}));state.selected='';renderCanvas();return;}
      if(action==='layers'){showLayers();return;}
      if(action==='occasion'||action==='category'){openSheet(action==='occasion'?'使用场景':'搭配分类',(action==='occasion'?['日常通勤','周末出游','朋友聚会','运动休闲']:['未分类','日常穿搭','出游灵感','正式场合']).map(value=>`<button class="choice" data-choice="${action}" data-value="${value}" aria-pressed="${state[action]===value}">${value}${state[action]===value?icon('check'):''}</button>`).join(''));return;}
      if(action==='more'){openSheet('更多设置',`<label>适合季节</label><div style="display:flex;gap:8px">${['春','夏','秋','冬'].map(value=>`<button class="chip" data-season="${value}" aria-pressed="${state.seasons.includes(value)}">${value}</button>`).join('')}</div><label for="notes">备注</label><textarea id="notes" maxlength="1000" placeholder="写点搭配灵感">${escapeText(state.notes)}</textarea><button class="primary" data-action="confirm-more">完成</button>`);return;}
      if(action==='confirm-more'){state.notes=document.getElementById('notes').value;closeSheet();return;}
      if(action==='save'){if(!document.getElementById('outfit-name').value.trim()){notify('请填写搭配名称');document.getElementById('outfit-name').focus();return;}notify('原型演示：搭配已保存');return;}
      if(action==='add-clothing'){notify('正式页面将进入添加衣物');return;}
      if(action==='back')notify('当前为新建搭配设计预览');
    });
    canvas.addEventListener('pointerdown',event=>{
      if(event.target.closest('[data-tool="rotate"],[data-tool="remove"]'))return;
      const target=event.target.closest('[data-item]');
      if(!target){state.selected='';renderCanvas();return;}
      event.preventDefault();state.selected=target.dataset.item;remember();
      const original={...state.items.find(item=>item.id===state.selected)};
      const rect=canvas.getBoundingClientRect();
      const start={x:event.clientX,y:event.clientY,resize:!!event.target.closest('[data-tool="resize"]')};
      renderCanvas();
      const move=moveEvent=>{const item=state.items.find(value=>value.id===original.id);const dx=(moveEvent.clientX-start.x)/rect.width*100;const dy=(moveEvent.clientY-start.y)/rect.height*100;if(start.resize){const factor=Math.max(.4,Math.min((100-original.x)/original.w,(100-original.y)/original.h,(original.w+dx)/original.w));item.w=original.w*factor;item.h=original.h*factor;renderCanvas();return;}item.x=Math.max(2,Math.min(98-original.w,original.x+dx));item.y=Math.max(2,Math.min(98-original.h,original.y+dy));renderCanvas();};
      const end=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){closeSheet();return;}
      const target=event.target.closest('[data-item]');
      if(target&&(event.key==='Enter'||event.key===' ')){event.preventDefault();state.selected=target.dataset.item;renderCanvas();}
      if(event.key==='Tab'&&document.querySelector('.sheet')){const controls=[...document.querySelectorAll('.sheet button,.sheet textarea')];const first=controls[0];const last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();return;}if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    });
    renderCanvas();renderLibrary();renderBackgrounds();
  </script>
</body>
</html>
