<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-label="系统架构 · 同机部署与单任务处理"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#8a9c87"/></marker></defs><rect width="1200" height="950" fill="#f5f4ef"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#293c31"><text x="48" y="44" font-size="12" letter-spacing="3">搭搭不搭搭 · DESIGN SYSTEM</text><text x="48" y="91" font-size="30" font-weight="600">系统架构 · 同机部署与单任务处理</text><text x="48" y="124" font-size="14" fill="#6c796e">4 核 / 标称 4 GB · 截图内存总量 3.32 GB · 下图为设计方案，尚未部署</text></g>
<rect x="48" y="175" width="270" height="120" rx="16" fill="#456653" stroke="#456653"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#fffefb"><text x="68" y="208" font-size="18" font-weight="600">微信原生小程序</text>
<text x="68" y="238" font-size="14">WXML / WXSS / TypeScript</text>
<text x="68" y="265" font-size="14">TDesign 基础组件 · SVG 图标</text>
</g>
<rect x="430" y="175" width="320" height="120" rx="16" fill="#456653" stroke="#456653"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#fffefb"><text x="450" y="208" font-size="18" font-weight="600">Nginx + HTTPS</text>
<text x="450" y="238" font-size="14">API 反向代理 / 上传限制</text>
<text x="450" y="265" font-size="14">私有媒体 internal 文件发送</text>
</g>
<polyline points="318,234 430,234" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="350" y="221" font-size="12" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#63765e">HTTPS</text>
<rect x="400" y="325" width="752" height="450" rx="22" fill="#e9eee3" stroke="#c4d2bd" stroke-dasharray="6 5"/>
<text x="48" y="811" font-size="13" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#6c796e">本机：业务 API、数据库、文件与单任务 Worker；无需引入 Redis 或独立向量数据库。</text>
<rect x="430" y="353" width="320" height="128" rx="16" fill="#fffefb" stroke="#d9dfd4"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#293c31"><text x="450" y="386" font-size="18" font-weight="600">Node.js / Express API</text>
<text x="450" y="416" font-size="14">身份与资源归属 · 参数校验</text>
<text x="450" y="443" font-size="14">SQL 事务 · 签名媒体链接</text>
<text x="450" y="470" font-size="14">任务状态 / 外部服务调用</text>
</g>
<rect x="800" y="353" width="320" height="128" rx="16" fill="#fffefb" stroke="#d9dfd4"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#293c31"><text x="820" y="386" font-size="18" font-weight="600">PostgreSQL 18.6-alpine</text>
<text x="820" y="416" font-size="14">业务数据 + 持久化任务</text>
<text x="820" y="443" font-size="14">同用户复合外键 · 版本冲突</text>
<text x="820" y="470" font-size="14">领取任务 / 租约 / 幂等约束</text>
</g>
<polyline points="590,295 590,353" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="750,415 800,415" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="761" y="403" font-size="12" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#63765e">SQL</text>
<rect x="430" y="566" width="320" height="155" rx="16" fill="#fffefb" stroke="#d9dfd4"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#293c31"><text x="450" y="599" font-size="18" font-weight="600">私有持久化文件目录</text>
<text x="450" y="629" font-size="14">原图 / 抠图 / 缩略图 / 导出</text>
<text x="450" y="656" font-size="14">数据库只保存路径及元数据</text>
<text x="450" y="683" font-size="14">按归属鉴权，短期签名读取</text>
<text x="450" y="710" font-size="14">过期导出与无引用文件清理</text>
</g>
<rect x="800" y="566" width="320" height="155" rx="16" fill="#fffefb" stroke="#d9dfd4"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#293c31"><text x="820" y="599" font-size="18" font-weight="600">Node.js Worker</text>
<text x="820" y="629" font-size="14">一次处理 1 张 · PG 阶段记录</text>
<text x="820" y="656" font-size="14">New API 抠图 + 识别 / 颜色建议</text>
<text x="820" y="683" font-size="14">结果须确认，失败保留原图</text>
<text x="820" y="710" font-size="14">Sharp 图片整理 / 缩略图 / 封面</text>
</g>
<polyline points="590,481 590,566" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="605" y="527" font-size="12" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#63765e">文件落盘 / 资产登记</text>
<polyline points="960,481 960,566" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="975" y="527" font-size="12" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#63765e">领取 / 更新任务</text>
<polyline points="800,646 750,646" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760" y="634" font-size="12" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#63765e">文件</text>
<rect x="48" y="355" width="270" height="154" rx="16" fill="#fffefb" stroke="#d9dfd4"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#293c31"><text x="68" y="388" font-size="18" font-weight="600">外部服务</text>
<text x="68" y="418" font-size="14">New API 图像 / 高德天气</text>
<text x="68" y="445" font-size="14">服务密钥仅在后端</text>
<text x="68" y="472" font-size="14">图像发送前授权 + 额度限制</text>
<text x="68" y="499" font-size="14">搭配建议 / 虚拟试穿待接入</text>
</g>
<polyline points="430,415 318,415" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="960,721 960,748 370,748 370,490 318,490" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="337" y="739" font-size="12" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#63765e">图像调用</text>
<text x="337" y="402" font-size="12" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#63765e">API 调用</text>
<rect x="48" y="566" width="270" height="155" rx="16" fill="#fffefb" stroke="#d9dfd4"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#293c31"><text x="68" y="599" font-size="18" font-weight="600">备份与恢复</text>
<text x="68" y="629" font-size="14">数据库备份 + 文件快照</text>
<text x="68" y="656" font-size="14">每日备份 / 初始保留 7 天</text>
<text x="68" y="683" font-size="14">至少一份异地副本</text>
<text x="68" y="710" font-size="14">必须执行恢复演练</text>
</g>
<polyline points="430,688 318,688" fill="none" stroke="#8a9c87" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="853" font-size="13" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#6c796e">图像任务需在 API + PG 正常负载下验证；分别记录外部调用耗时与图片后处理资源。</text>
<text x="48" y="883" font-size="13" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" fill="#6c796e">外部任务在供应商状态不明时只查原任务，不重新发起收费请求；上线前确认供应商数据保存规则。</text>
</svg>
