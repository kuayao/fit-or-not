name: fit-or-not-local
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: fit_or_not
      POSTGRES_USER: fit_or_not
      POSTGRES_PASSWORD: local-fit-or-not-only
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fit_or_not -d fit_or_not"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
