name: fit-or-not-production
services:
  api:
    image: fit-or-not-backend:0.1.6
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    networks:
      panel:
        aliases:
          - fit-or-not-api
    ports:
      - "127.0.0.1:3006:3006"
    volumes:
      - media:/app/media
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    image: fit-or-not-backend:0.1.6
    pull_policy: never
    platform: linux/amd64
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    networks:
      - panel
    volumes:
      - media:/app/media
    depends_on:
      api:
        condition: service_healthy
volumes:
  media:
networks:
  panel:
    external: true
    name: ${PANEL_NETWORK:-1panel-network}
